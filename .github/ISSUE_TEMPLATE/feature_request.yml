name: Feature request
description: Suggest an idea or improvement for this fork.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This fork is built around its author's own reading (desk triage and phone swipe
        triage), so ideas that fit that loop are the likeliest to land.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation first; the best fix may not be the first one that comes to mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
