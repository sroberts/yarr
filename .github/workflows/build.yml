name: Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_macos:
    name: Build for MacOS
    # macos-15 (Apple Silicon). macos-13 Intel runners were chronically
    # queueing then cancelling; macos-14 is retired on 2026-11-02 and its
    # brownouts left jobs queued with no runner. Go builds the amd64 target
    # by cross-compiling (clang -arch x86_64) just fine here.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - name: Build arm64 gui
      uses: ./.github/actions/prepare
      with:
        id: darwin_arm64_gui
        cmd: make darwin_arm64_gui
        out: out/darwin_arm64_gui/yarr.app
    - name: Build amd64 gui
      uses: ./.github/actions/prepare
      with:
        id: darwin_amd64_gui
        cmd: make darwin_amd64_gui
        out: out/darwin_amd64_gui/yarr.app
    - name: Build arm64 cli
      uses: ./.github/actions/prepare
      with:
        id: darwin_arm64
        cmd: make darwin_arm64
        out: out/darwin_arm64/yarr
    - name: Build amd64 cli
      uses: ./.github/actions/prepare
      with:
        id: darwin_amd64
        cmd: make darwin_amd64
        out: out/darwin_amd64/yarr

  build_windows:
    name: Build for Windows
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - name: Build amd64 gui
      uses: ./.github/actions/prepare
      with:
        id: windows_amd64_gui
        cmd: make windows_amd64_gui
        out: out/windows_amd64_gui/yarr.exe
    - name: Build arm64 gui
      if: false
      uses: ./.github/actions/prepare
      with:
        id: windows_arm64_gui
        cmd: make windows_arm64_gui
        out: out/windows_arm64_gui/yarr.exe

  build_multi_cli:
    name: Build for Windows/MacOS/Linux CLI
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - name: Setup Zig
      uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
      with:
        version: 0.14.0
    - name: Build linux/amd64
      uses: ./.github/actions/prepare
      with:
        id: linux_amd64
        cmd: make linux_amd64
        out: out/linux_amd64/yarr
    - name: Build linux/arm64
      uses: ./.github/actions/prepare
      with:
        id: linux_arm64
        cmd: make linux_arm64
        out: out/linux_arm64/yarr
    - name: Build linux/armv7
      uses: ./.github/actions/prepare
      with:
        id: linux_armv7
        cmd: make linux_armv7
        out: out/linux_armv7/yarr
    - name: Build windows/amd64
      uses: ./.github/actions/prepare
      with:
        id: windows_amd64
        cmd: make windows_amd64
        out: out/windows_amd64/yarr
    - name: Build windows/arm64
      uses: ./.github/actions/prepare
      with:
        id: windows_arm64
        cmd: make windows_arm64
        out: out/windows_arm64/yarr

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    # attaching assets to the release is the one write this workflow needs
    permissions:
      contents: write
    needs: [build_macos, build_windows, build_multi_cli]
    # Run unless the whole workflow was cancelled — so a single platform
    # failing (historically macOS) still attaches every binary that built,
    # instead of blocking the release entirely.
    if: ${{ !cancelled() }}
    steps:
    # Only the descriptor: the steps below glob the working directory for the
    # artifacts, and a full tree would give them more to trip over.
    - name: Checkout outpost.toml
      uses: actions/checkout@v4
      with:
        sparse-checkout: outpost.toml
        sparse-checkout-cone-mode: false
    - name: Download Artifacts
      uses: actions/download-artifact@v4.1.7
      with:
        path: .
    - name: Preparation
      run: |
        set -ex
        ls -R
        for tarfile in `ls **/*.tar`; do
          tar -xvf $tarfile
        done
        for dir in out/*; do
          echo "Compressing: $dir"
          (test -d "$dir" && cd $dir && zip -r ../yarr_`basename $dir`.zip *)
        done
        ls out
    - name: Upload Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          # release.yml owns release creation; this only attaches the binary
          # artifacts to the existing release. draft:false keeps it published.
          draft: false
          prerelease: false
          files: |
            out/*.zip
            outpost.toml
