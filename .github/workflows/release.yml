name: Release

# Cut a tagged release from environments that cannot push tag refs
# directly (e.g. Claude Code web sessions, whose git proxy only accepts
# branch pushes). Reads the version from the makefile, creates the
# matching vX.Ys tag on the chosen ref, and dispatches the build and
# docker workflows against that tag — reproducing exactly what a manual
# tag push does.
#
# Usage: bump VERSION in the makefile (via PR) and merge, then run this
# workflow (Actions tab → Release → Run workflow, or the Actions API).
#
# Mechanism note: a tag pushed with GITHUB_TOKEN does not auto-trigger
# the `on: push: tags` workflows (GitHub's anti-recursion rule), so this
# job dispatches them explicitly. workflow_dispatch is an explicit
# exception to that rule and is allowed with GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to tag
        required: false
        default: master

permissions:
  contents: write
  actions: write

jobs:
  tag-and-build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Derive version and tag
        id: ver
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION=//p' makefile | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::could not read VERSION from makefile"; exit 1
          fi
          tag="v${version}s"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Guard against existing tag
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists on origin — bump VERSION in the makefile first"
            exit 1
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"

      - name: Dispatch build and docker workflows on the tag
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          for wf in build.yml build-docker.yml build-docker-once.yml; do
            echo "Dispatching $wf on $tag"
            gh workflow run "$wf" --ref "$tag"
          done

      - name: Summary
        run: |
          {
            echo "## Release ${{ steps.ver.outputs.tag }}"
            echo
            echo "Tag pushed and build/docker workflows dispatched on the tag."
            echo "A draft pre-release will appear under Releases once \`build.yml\` finishes."
          } >> "$GITHUB_STEP_SUMMARY"
